services:
  # фронтенд - вот тут пробрасываем порты
  frontend:
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy

  # Наш бэк - порты НЕ пробрасываем
  backend:
    build: .
    container_name: backend_block_6
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD","curl","http://127.0.0.1:8000/health"]
      start_period: 5s
      interval: 3s
      retries: 5

  # БДщка - порты тоже не пробрасываем
  db:
    image: postgres:16
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL","pg_isready","-U","$${POSTGRES_USER}","-d","$${POSTGRES_DB}"]
      start_period: 5s
      interval: 3s
      retries: 5

volumes:
  postgres_volume:
